<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Order form registration</title></head>
  <body>
    <form name="order" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="order" />
      <input name="name" />
      <input name="mobile" type="tel" />
      <textarea name="address"></textarea>
      <input name="city" />
      <select name="state"><option value="">Select</option></select>
      <input name="pincode" />
      <input name="edition" />
      <input name="quantity" />
      <input name="order_total" />
      <input name="order_ref" />
      <input name="bot-field" />
    </form>
  </body>
</html>
